[versions]
kotlin = "2.1.0"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
ktor = "3.0.3"
sqldelight = "2.0.2"
agp = "8.7.3"
compose-bom = "2024.12.01"
# Charting. Apache-2 and on Maven Central, so it clears F-Droid's
# build-from-source and no-proprietary-dependency rules.
vico = "2.1.3"
androidx-activity = "1.9.3"
androidx-lifecycle = "2.8.7"
androidx-navigation = "2.8.5"
androidx-work = "2.10.0"
androidx-security = "1.1.0-alpha06"
sqlcipher = "4.6.1"
androidx-sqlite = "2.4.0"
androidx-test = "1.6.1"
robolectric = "4.14.1"
# JVM screenshot tests on Robolectric: the redesigned screens can be looked at
# without a device — the phone is somebody's phone. Apache-2, Maven Central.
roborazzi = "1.39.0"
junit4 = "4.13.2"
protobuf = "4.29.3"
protobuf-plugin = "0.9.4"
slf4j = "2.0.16"
androidx-annotation = "1.9.1"
json = "20250107"
desugar-jdk-libs = "2.1.3"
apache-commons = "3.17.0"
androidx-localbroadcastmanager = "1.1.0"
androidx-core = "1.15.0"
androidx-media = "1.7.0"
# MapLibre Native. BSD-2, no Google Play Services — two of the three things
# that matter for an F-Droid target. It is the renderer the web app already
# uses, so both clients consume the one style document the server serves
# rather than each maintaining a style builder.
#
# The third thing, Maven Central, is where this stops being true. The renderer
# itself is now a local AAR built from the branch where 3D terrain is being
# implemented — no release has it, at any version — so it is the one prebuilt
# binary here. See mobile/vendor/build-maplibre-terrain.sh, which argues the
# exception and says how to undo it. These libraries are MapLibre's *Java*
# side, still from Maven Central, and are declared explicitly because a file
# dependency carries no POM.
maplibreServices = "6.0.1"
maplibreGestures = "0.0.4"
okhttp = "4.12.0"
timber = "5.0.1"
androidx-interpolator = "1.0.0"
androidx-fragment = "1.8.9"
# The libsodium sealed box has no JDK or AndroidX equivalent, and every
# alternative that does ships a prebuilt .so - which F-Droid will not take.
# Bouncy Castle is pure Java and has all four primitives the construction needs.
bouncycastle = "1.78.1"
# The watch-app bundle is one solid xz stream: 93 near-identical Connect IQ
# builds are 6.8 MB compressed one by one and 0.2 MB compressed together, and
# the JDK has no decoder for anything with a window wider than 32 KB. Pure
# Java, 0BSD, on Maven Central. See watchapp/devices.py.
xz = "1.10"

[libraries]
xz = { module = "org.tukaani:xz", version.ref = "xz" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-json-module = { module = "app.cash.sqldelight:sqlite-json-module", version.ref = "sqldelight" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }

# Build-tool only: the vendored FIT code generator parses Garmin's profile JSON
# with it. Never shipped in the APK.
json = { module = "org.json:json", version.ref = "json" }
# Backports java.time and friends for the Java 17 language level :device-garmin
# needs. minSdk 26 already has java.time, but the vendored code also reaches for
# newer stream/collection APIs.
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }

# Real dependencies of the vendored Gadgetbridge code, not shims.
apache-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "apache-commons" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "androidx-localbroadcastmanager" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }
maplibre-geojson = { module = "org.maplibre.gl:android-sdk-geojson", version.ref = "maplibreServices" }
maplibre-turf = { module = "org.maplibre.gl:android-sdk-turf", version.ref = "maplibreServices" }
maplibre-gestures = { module = "org.maplibre.gl:maplibre-android-gestures", version.ref = "maplibreGestures" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
androidx-interpolator = { module = "androidx.interpolator:interpolator", version.ref = "androidx-interpolator" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
