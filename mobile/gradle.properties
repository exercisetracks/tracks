org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Required by every AndroidX dependency, which is all of them.
android.useAndroidX=true

# Non-transitive R classes: a module's R only carries its own resources, not
# every dependency's. Smaller builds and no accidental cross-module resource
# references. Default in new projects; stated because AGP warns if it is unset.
android.nonTransitiveRClass=true
