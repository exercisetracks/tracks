# Strength-training muscle groups — FIT exercise_category (Profile 21.205) to
# the muscle keys it works, plus the human labels for both vocabularies.
#
# Single source of truth — `spec/codegen.py` generates the Python, JavaScript,
# and Kotlin tables. Edit here, run the codegen; the generated files are
# overwritten.
#
# ── Where this came from ─────────────────────────────────────────────────────
# Transcribed from frontend/src/utils/muscleGroups.js, the only implementation
# that existed before this spec — the web app has shown muscle activation on
# strength activities since before the backend had any opinion on the subject.
# That file becomes a thin wrapper over the generated table; the backend gets
# a muscle-activation calculator for the first time via this spec.
#
# ── Muscle key vocabulary ────────────────────────────────────────────────────
# Keys align with the regions the frontend's BodyDiagram.jsx draws:
#   front:  chest, front_delts, side_delts, biceps, forearms, abs, obliques,
#           hip_flexors, quads, calves_front
#   back:   traps, rear_delts, lats, mid_back, triceps, lower_back, glutes,
#           hamstrings, calves_back
# `shoulders` and `core` also appear as secondary-muscle values (from
# total_body and core-ish categories) despite having no entry in
# muscle_labels below — that is the original behaviour, not an omission here.
# muscleLabel() falls back to the raw key for anything not in the table, and
# "shoulders" has always hit that fallback.
#
# ── category_muscles ─────────────────────────────────────────────────────────
# Each FIT exercise_category maps to {primary, secondary} muscle keys. Primary
# movers are weighted higher than secondary when a session's sets are turned
# into a per-muscle activation score — see the hand-written
# computeMuscleActivation in each language (backend/app/calculators/, the
# frontend's spec/muscleActivation.js, mobile's spec/MuscleGroups.kt).
#
# `hip_hinge`, `push`, and `pull` are Garmin firmware extensions beyond the
# base Profile 21.205 enum (categories >= roughly 21.16x) and are deliberately
# absent from category_labels — categoryLabel() title-cases them from the key
# instead, same as any category this table has never heard of.

category_muscles:
  bench_press:        {primary: [chest],                          secondary: [front_delts, triceps]}
  calf_raise:         {primary: [calves_front, calves_back],       secondary: []}
  cardio:              {primary: [],                                secondary: []}
  carry:               {primary: [forearms, traps],                 secondary: [abs, obliques, lower_back, glutes]}
  chop:                {primary: [obliques],                        secondary: [abs, side_delts, rear_delts]}
  core:                {primary: [abs, obliques],                   secondary: [lower_back]}
  crunch:              {primary: [abs],                             secondary: [obliques, hip_flexors]}
  curl:                {primary: [biceps],                          secondary: [forearms]}
  deadlift:            {primary: [hamstrings, glutes, lower_back],  secondary: [traps, forearms, lats, quads, adductors]}
  flye:                {primary: [chest],                           secondary: [front_delts]}
  hip_raise:           {primary: [glutes],                          secondary: [hamstrings, lower_back]}
  hip_stability:       {primary: [glutes],                          secondary: [obliques, hamstrings]}
  hip_swing:           {primary: [glutes, hamstrings],              secondary: [lower_back, abs]}
  hyperextension:      {primary: [lower_back],                      secondary: [glutes, hamstrings]}
  lateral_raise:       {primary: [side_delts],                      secondary: [traps, rear_delts]}
  leg_curl:            {primary: [hamstrings],                      secondary: [calves_back]}
  leg_raise:           {primary: [abs, hip_flexors],                secondary: [obliques]}
  lunge:               {primary: [quads, glutes],                   secondary: [hamstrings, calves_front, calves_back, adductors]}
  olympic_lift:        {primary: [quads, glutes, traps],            secondary: [lower_back, front_delts, side_delts, forearms, hamstrings]}
  plank:               {primary: [abs],                             secondary: [obliques, front_delts, lower_back]}
  plyo:                {primary: [quads, calves_front, calves_back],secondary: [glutes, hamstrings]}
  pull_up:             {primary: [lats],                            secondary: [biceps, rear_delts, mid_back, forearms]}
  push_up:             {primary: [chest, triceps],                  secondary: [front_delts, abs]}
  row:                 {primary: [lats, mid_back],                  secondary: [rear_delts, biceps, traps, forearms]}
  shoulder_press:      {primary: [front_delts, side_delts],         secondary: [triceps, traps]}
  shoulder_stability:  {primary: [rear_delts],                      secondary: [traps]}
  shrug:               {primary: [traps],                           secondary: [forearms]}
  sit_up:              {primary: [abs],                             secondary: [hip_flexors, obliques]}
  squat:               {primary: [quads, glutes],                   secondary: [hamstrings, lower_back, calves_front, calves_back, adductors]}
  total_body:          {primary: [chest, lats, quads, glutes],      secondary: [abs, shoulders, biceps, triceps, hamstrings]}
  triceps_extension:   {primary: [triceps],                         secondary: []}
  warm_up:             {primary: [],                                secondary: []}
  run:                 {primary: [],                                secondary: []}
  # Garmin firmware extensions (Profile >= 21.16x) — see the note above.
  hip_hinge:           {primary: [glutes, hamstrings],              secondary: [lower_back]}
  push:                {primary: [chest, front_delts, triceps],     secondary: [side_delts, abs]}
  pull:                {primary: [lats, biceps],                    secondary: [rear_delts, mid_back, forearms]}

muscle_labels:
  chest:         Chest
  front_delts:   Front Deltoids
  side_delts:    Side Deltoids
  rear_delts:    Rear Deltoids
  biceps:        Biceps
  triceps:       Triceps
  forearms:      Forearms
  traps:         Trapezius
  lats:          Lats
  mid_back:      Mid Back
  lower_back:    Lower Back
  abs:           Abs
  obliques:      Obliques
  hip_flexors:   Hip Flexors
  glutes:        Glutes
  quads:         Quads
  hamstrings:    Hamstrings
  calves_front:  Calves (Front)
  calves_back:   Calves
  adductors:     Adductors
  neck:          Neck
  core:          Core
  upper_back:    Upper Back
  # The keys below are used by the exercise and stretch libraries
  # (spec/library/) but have no region of their own on the body diagram. They
  # still need a name: without one, a raw key like `hip_external_rotators`
  # reaches the screen. A library key with no label here fails the library
  # tests on both sides.
  achilles:              Achilles
  back:                  Back
  brachialis:            Brachialis
  calves:                Calves
  feet:                  Feet
  full_body:             Full Body
  groin:                 Groin
  hands:                 Hands
  hip_abductors:         Hip Abductors
  hip_adductors:         Hip Adductors
  hip_external_rotators: Hip External Rotators
  hips:                  Hips
  intercostals:          Intercostals
  pec_minor:             Pec Minor
  shoulders:             Shoulders
  spinal_erectors:       Spinal Erectors
  thoracic_spine:        Thoracic Spine
  wrists:                Wrists

category_labels:
  bench_press:         Bench Press
  calf_raise:          Calf Raise
  cardio:              Cardio
  carry:               Carry
  chop:                Chop
  core:                Core
  crunch:              Crunch
  curl:                Curl
  deadlift:            Deadlift
  flye:                Flye
  hip_raise:           Hip Raise
  hip_stability:       Hip Stability
  hip_swing:           Hip Swing
  hyperextension:      Hyperextension
  lateral_raise:       Lateral Raise
  leg_curl:            Leg Curl
  leg_raise:           Leg Raise
  lunge:               Lunge
  olympic_lift:        Olympic Lift
  plank:               Plank
  plyo:                Plyometric
  pull_up:             Pull-Up
  push_up:             Push-Up
  row:                 Row
  shoulder_press:      Shoulder Press
  shoulder_stability:  Shoulder Stability
  shrug:               Shrug
  sit_up:              Sit-Up
  squat:               Squat
  total_body:          Total Body
  triceps_extension:   Triceps Extension
  warm_up:             Warm-Up
  run:                 Run

# ── body_viewer ──────────────────────────────────────────────────────────────
# How a muscle key becomes a shape on the anatomical body diagram.
#
# Three vocabularies meet here and none of them is the others:
#   * the muscle keys above (`chest`, `calves_front`) — what an exercise works
#   * left/right *regions* (`chest_l`, `adductors_br`) — what a body has two of
#   * react-muscle-highlighter's part slugs (`quadriceps`, `upper-back`) — what
#     the artwork actually draws, which is coarser than either
#
# The artwork has one `quadriceps` shape for what Tracks calls quads *and* hip
# flexors, one `upper-back` for lats and mid-back, and one `deltoids` per view
# that stands in for front, side and rear delts depending on which side you are
# looking at. That collapsing is why this cannot be derived and has to be
# written down.
#
# This lived in frontend/src/components/activity/charts/MuscleMap.jsx as two
# object literals until the mobile app needed the same diagram. Transcribing it
# into Kotlin by hand would have made a second definition of a table whose
# entire job is to be one — the same reasoning that put category_muscles here.
#
# `muscle` is the key activation is looked up under; it is not always the
# region with its side suffix removed (`ankles_l` shades with calves_front,
# because the artwork's ankle shape is part of the lower leg Tracks measures as
# calves). `view` is which body the shape is on — a region appears on exactly
# one, which is why rear_delts is on the back and front_delts is not.

body_viewer:
  regions:
    chest_l:         {muscle: chest, slug: chest, view: front}
    chest_r:         {muscle: chest, slug: chest, view: front}
    front_delts_l:   {muscle: front_delts, slug: deltoids, view: front}
    front_delts_r:   {muscle: front_delts, slug: deltoids, view: front}
    side_delts_l:    {muscle: side_delts, slug: deltoids, view: front}
    side_delts_r:    {muscle: side_delts, slug: deltoids, view: front}
    biceps_l:        {muscle: biceps, slug: biceps, view: front}
    biceps_r:        {muscle: biceps, slug: biceps, view: front}
    forearms_l:      {muscle: forearms, slug: forearm, view: front}
    forearms_r:      {muscle: forearms, slug: forearm, view: front}
    abs:             {muscle: abs, slug: abs, view: front}
    obliques_l:      {muscle: obliques, slug: obliques, view: front}
    obliques_r:      {muscle: obliques, slug: obliques, view: front}
    hip_flexors_l:   {muscle: hip_flexors, slug: quadriceps, view: front}
    hip_flexors_r:   {muscle: hip_flexors, slug: quadriceps, view: front}
    quads_l:         {muscle: quads, slug: quadriceps, view: front}
    quads_r:         {muscle: quads, slug: quadriceps, view: front}
    calves_front_l:  {muscle: calves_front, slug: tibialis, view: front}
    calves_front_r:  {muscle: calves_front, slug: tibialis, view: front}
    neck_l:          {muscle: neck, slug: neck, view: front}
    neck_r:          {muscle: neck, slug: neck, view: front}
    ankles_l:        {muscle: calves_front, slug: ankles, view: front}
    ankles_r:        {muscle: calves_front, slug: ankles, view: front}
    hands_l:         {muscle: hands, slug: hands, view: front}
    hands_r:         {muscle: hands, slug: hands, view: front}
    feet_l:          {muscle: feet, slug: feet, view: front}
    feet_r:          {muscle: feet, slug: feet, view: front}
    traps:           {muscle: traps, slug: trapezius, view: back}
    rear_delts_l:    {muscle: rear_delts, slug: deltoids, view: back}
    rear_delts_r:    {muscle: rear_delts, slug: deltoids, view: back}
    mid_back:        {muscle: mid_back, slug: upper-back, view: back}
    lats_l:          {muscle: lats, slug: upper-back, view: back}
    lats_r:          {muscle: lats, slug: upper-back, view: back}
    triceps_l:       {muscle: triceps, slug: triceps, view: back}
    triceps_r:       {muscle: triceps, slug: triceps, view: back}
    lower_back:      {muscle: lower_back, slug: lower-back, view: back}
    glutes_l:        {muscle: glutes, slug: gluteal, view: back}
    glutes_r:        {muscle: glutes, slug: gluteal, view: back}
    hamstrings_l:    {muscle: hamstrings, slug: hamstring, view: back}
    hamstrings_r:    {muscle: hamstrings, slug: hamstring, view: back}
    calves_back_l:   {muscle: calves_back, slug: calves, view: back}
    calves_back_r:   {muscle: calves_back, slug: calves, view: back}
    adductors_l:     {muscle: adductors, slug: adductors, view: front}
    adductors_r:     {muscle: adductors, slug: adductors, view: front}
    adductors_bl:    {muscle: adductors, slug: adductors, view: back}
    adductors_br:    {muscle: adductors, slug: adductors, view: back}
    # Corrected in transcription: the browser had no pairing entry for
    # these two, so they fell back to the region key and looked up an
    # activation named `neck_bl` that nothing ever produces — the neck on
    # the back view never shaded. It does now.
    neck_bl:         {muscle: neck, slug: neck, view: back}
    neck_br:         {muscle: neck, slug: neck, view: back}
