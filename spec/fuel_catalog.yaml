#
# Common race foods, offered in the fuel section's "Add product" pick list so
# nobody types a label in by hand. Picking one copies it into the user's own
# products (editable); nothing here is synced or stored. `spec/codegen.py`
# generates the JavaScript and Kotlin tables.
#
# Per serving as sold, from the maker's label (checked 2026-11-02). Flavours
# differ by a few milligrams of sodium; the plain flavour is used. Where a
# label gives potassium only as %DV it is converted at the 4700 mg DV.
#   GU Energy Gel: guenergy.com (Vanilla Bean label)
#   Honey Stinger gel / waffle / chews: honeystinger.com, retailer labels
#   Clif Shot Bloks: 3 pieces, retailer label
#   Maurten Gel 100: maurten.com
#   Tailwind Endurance Fuel: 1 scoop in 500 ml
#   Gatorade Thirst Quencher: 20 fl oz bottle
#   Snickers: 1.86 oz bar, snickers.com (potassium 4% DV)
#   Rice Krispies Treats: 22 g bar, Kellogg's SmartLabel
#   Banana: medium, USDA FoodData Central
products:
  - {name: "GU Energy Gel", kind: gel, carbs_g: 22, sodium_mg: 60, potassium_mg: 40, caffeine_mg: 0, fluid_ml: 0}
  - {name: "GU Energy Gel, salted", kind: gel, carbs_g: 22, sodium_mg: 125, potassium_mg: 55, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Honey Stinger Energy Gel", kind: gel, carbs_g: 24, sodium_mg: 50, potassium_mg: 50, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Honey Stinger Waffle", kind: bar, carbs_g: 19, sodium_mg: 55, potassium_mg: 30, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Honey Stinger Energy Chews", kind: chew, carbs_g: 39, sodium_mg: 80, potassium_mg: 40, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Clif Shot Bloks (3)", kind: chew, carbs_g: 24, sodium_mg: 50, potassium_mg: 20, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Maurten Gel 100", kind: gel, carbs_g: 25, sodium_mg: 20, potassium_mg: 0, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Maurten Gel 100 CAF 100", kind: gel, carbs_g: 25, sodium_mg: 22, potassium_mg: 0, caffeine_mg: 100, fluid_ml: 0}
  - {name: "Tailwind (1 scoop)", kind: drink, carbs_g: 25, sodium_mg: 303, potassium_mg: 88, caffeine_mg: 0, fluid_ml: 500}
  - {name: "Gatorade (20 oz)", kind: drink, carbs_g: 36, sodium_mg: 270, potassium_mg: 75, caffeine_mg: 0, fluid_ml: 591}
  - {name: "Snickers", kind: bar, carbs_g: 32, sodium_mg: 130, potassium_mg: 190, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Rice Krispies Treat", kind: bar, carbs_g: 17, sodium_mg: 105, potassium_mg: 0, caffeine_mg: 0, fluid_ml: 0}
  - {name: "Banana", kind: other, carbs_g: 27, sodium_mg: 1, potassium_mg: 422, caffeine_mg: 0, fluid_ml: 0}
