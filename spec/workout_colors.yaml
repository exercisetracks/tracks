#
# How a planned workout is coloured, on the web and on the phone.
#
# Hue says what kind of session it is; shade says how hard. Both apps used to
# colour by workout type alone, from two hand-kept tables, so an easy run and
# an easy spin were the same green, a strength session's colour depended on a
# word in its title, and every type either table had not heard of — `long`,
# `easy_recovery`, `flexibility`, which are what the plan generators actually
# emit — fell through to grey.
#
# A family is a sport type from sport_taxonomy.yaml, plus two that are about the
# session rather than the sport: `stretching` (flexibility and mobility work,
# whatever sport it is filed under) and `race`, which keeps its inverted chip.
# Families nearby in a week get hues far apart on the wheel; none uses the
# green the default accent is drawn in, so a plan never reads as "selected".
#
# Regenerate with `python3 spec/codegen.py`; the resolver that reads these
# tables is lib/workoutColors.js on the web and core spec/WorkoutColors.kt on
# the phone, rule for rule.

families:
  running: blue
  hiking: lime
  cycling: amber
  indoor_cycling: amber
  mtb: orange
  swimming: cyan
  rowing: indigo
  paddling: yellow
  skiing: sky
  nordic_skiing: teal
  climbing: rose
  bouldering: rose
  triathlon: fuchsia
  strength: violet
  stretching: pink
  mind_body: pink
  other: slate

# Workout types that make a session `stretching` whatever its sport says.
stretching_types: [flexibility, mobility, stretch, yoga]

# Shade: 1 easy, 2 steady or long, 3 hard. Unlisted types are 2, the middle,
# so a new type is visibly in its family and never mistaken for easy or hard.
levels:
  1: [easy, easy_recovery, recovery, easy_spin, aerobic, technique, ut2, skills,
      pole_hike, arc, flexibility, mobility, stretch, yoga, drills]
  2: [long, long_run, endurance, ut1, back_to_back, vert, descent, eccentric,
      agility, strength]
  3: [tempo, threshold, css, sweet_spot, intervals, vo2, vo2max, race_pace,
      fartlek, short_quality, sprint, plyometrics, hangboard, limit_bouldering,
      incline_intervals, bounding, ski_intervals, power_endurance, micro_bursts,
      over_unders, matchbook, standing_starts, descent_repeats, field_test]

# Tailwind v3's palette for the hues above, so the phone draws the web's
# colours exactly. Steps 100–900.
palette:
