# Alembic config for Tracks. The database URL is injected by alembic/env.py
# from app.config.settings (same .env-driven source the app uses) — the empty
# sqlalchemy.url here is never used.
[alembic]
script_location = %(here)s/alembic
# Make the `app` package importable when the CLI runs from /app.
prepend_sys_path = %(here)s
sqlalchemy.url =

# Template for new revision filenames: date first so `ls` sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
