#
# Tracks. Save this file in a folder of its own, then:
#
#   docker compose up -d                          # start
#   docker compose pull && docker compose up -d   # update
#
# Then open http://localhost:4080 and create your admin account — before
# exposing the port, since until an admin exists anyone who reaches it can
# claim it. Everything else is in the README.
#
# Settings live in a `.env` file next to this one (start from .env.example).
# It is optional: every setting below has a working default, so this file
# runs as it is. Edit .env rather than this file, and an update to this file
# never overwrites your settings.

services:
  tracks:
    # "latest" follows every release, a 2.0 included. To stay on one, pin it
    # here: exercisetracks/tracks:1 for 1.x, or an exact version.
    image: exercisetracks/tracks:latest
    container_name: tracks
    restart: unless-stopped
    # Room for every service to stop cleanly on slow hardware; Docker's 10 s
    # default is usually enough, but it is the database at the end of it.
    stop_grace_period: 1m
    ports:
      - "${TRACKS_PORT:-4080}:80"
    volumes:
      # A volume name or a host folder for each.
      - ${TRACKS_DATA:-tracks-data}:/data
      - ${TRACKS_MAPS:-tracks-maps}:/map-data
      # A Garmin watch plugged into this machine's USB: uncomment this line and
      # the device_cgroup_rules below. Access is the USB bus's device nodes
      # only, not a privileged container.
      # - /dev/bus/usb:/dev/bus/usb
    # device_cgroup_rules:
    #   - "c 189:* rwm"
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      BEHIND_PROXY: ${BEHIND_PROXY:-false}

volumes:
  tracks-data:
  tracks-maps:
