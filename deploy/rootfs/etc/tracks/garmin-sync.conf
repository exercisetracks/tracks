;
; Linked into conf.d by tracks-init only when /dev/bus/usb was passed in.

[program:garmin-sync]
command=/usr/local/bin/tracks-run garmin-sync
priority=20
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
