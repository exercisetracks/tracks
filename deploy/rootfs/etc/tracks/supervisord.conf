;
; The services of the all-in-one image. Each one's output goes to the
; container's log (`docker logs tracks`).
;
; Two priority groups only. The supervisor stops groups one after another, so
; every extra group adds its slowest member to the shutdown — and Docker kills
; whatever is still running 10 s after `docker stop`. So the services that
; write to the database share one group and stop together, then the database
; and the session cache stop after them. Start order needs nothing finer:
; tracks-run makes the API and worker wait for the database themselves.
; (A database killed mid-shutdown is not corrupted — PostgreSQL replays its
; WAL on the next start — but a clean stop is quicker to come back from.)

[supervisord]
nodaemon=true
user=root
; In nodaemon mode its own log (starts, exits, restarts) already goes to
; stdout, i.e. `docker logs`; a logfile as well would print every line twice.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
command=/usr/local/bin/tracks-run postgres
priority=10
; SIGINT is PostgreSQL's "fast" shutdown: roll back open transactions and stop
; cleanly, instead of waiting for every client to disconnect.
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/local/bin/tracks-run redis
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
command=/usr/local/bin/tracks-run backend
priority=20
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=/usr/local/bin/tracks-run worker
priority=20
startsecs=5
startretries=10
; Celery finishes the task in hand on SIGTERM before exiting.
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tiles]
command=/usr/local/bin/tracks-run tiles
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:brouter]
command=/usr/local/bin/tracks-run brouter
priority=20
; 143 is how a JVM reports stopping on SIGTERM — a normal stop, not a crash.
exitcodes=0,143
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=/usr/local/bin/tracks-run web
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files = /etc/tracks/conf.d/*.conf
