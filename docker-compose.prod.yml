# ── Tracks production overlay ─────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Automates the "# PRODUCTION" hardening steps documented in docker-compose.yml:
#   - backend runs the baked image (no live-source bind mount)
#   - frontend serves the built bundle (no HMR, no source mounts)
#   - every loopback debug port is removed — Caddy is the only listener
#   - backend gains a healthcheck (image already ships curl + /healthz)
#
# Requires Docker Compose >= 2.24 (!reset / !override merge tags).

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    volumes: !override
      - ${HOST_FIT_DIR:-./fit-files}:/fit-files
      - ${HOST_MAPDATA_DIR:-./map-data}:/map-data
    ports: !reset []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  go-pmtiles:
    ports: !reset []

  brouter:
    ports: !reset []

  frontend:
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "3000"]
    volumes: !reset []
    ports: !reset []
